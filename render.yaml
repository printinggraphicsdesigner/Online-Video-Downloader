services:
  - type: web
    name: online-video-downloader
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    envVars:
      - key: YTDL_NO_UPDATE
        value: "1"
      - key: WEB_CONCURRENCY
        value: 2
    healthCheckPath: /health
    autoDeploy: true
